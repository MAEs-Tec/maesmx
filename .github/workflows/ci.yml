name: CI

# Corre en cada PR hacia dev o master y en cada push a dev.
# deploy.yml lo reutiliza (workflow_call) antes de desplegar.
on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix functions

      # Informativo mientras se limpian los errores heredados de src/.
      # Cuando `npm run lint` pase en limpio, quitar continue-on-error.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Pruebas unitarias
        run: npm test

      - name: Build
        run: npm run build

      - name: Caché de los emuladores de Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-14.25.0

      - name: Seed y pruebas de integración con emuladores
        run: npm run test:emulator
