name: Cost and regression checks
on:
  pull_request:
    branches: [dev, 'codex/**']
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run measure:bundle
      - run: npx --yes firebase-tools@14.25.0 emulators:exec --only firestore,auth,functions,storage --project demo-maes-costs "node --test tests/emulator.test.cjs"
